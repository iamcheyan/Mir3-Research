[set]
postmoney=2000
;每次发言所需金币
hfmoney=1000
;每次回复所需金币

[gbname]
gbname=〖 冰月孤魂留言本 〗
;留言本名称，改成你自己的

[gmword]
gmword={FCOLOR/5}该留言已被GM屏蔽{FCOLOR/12}
;GM屏蔽留言所使用的话

[count]
num=11
;总留言条数,初始=0

[page]
page=2
;总页数,初始=1

[pagecount]
pagecount=1
;上面为记数器,用默认,初始=0
percount=10
;上面为每页留言条数10,如果修改的话,要修改以下各页码指向的首条留言记录,最多支持每页10条

[check]
