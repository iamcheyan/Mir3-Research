const PAGE_SIZE = 50;
let currentPage = 0;
let filtered = DATA;

function render() {
  const tbody = document.getElementById('tbody');
  const start = currentPage * PAGE_SIZE;
  const pageItems = filtered.slice(start, start + PAGE_SIZE);
  tbody.innerHTML = pageItems.map(r => {
    const iconHtml = r.icon
      ? `<img src="${r.icon}" loading="lazy" onerror="this.style.display='none'">`
      : `<span class="no-icon">无图标</span>`;
    const srcHtml = r.src === 'vision'
      ? '<span class="src-vision">🎯 视觉识别</span>'
      : '<span class="src-infer">📝 推断</span>';
    const guessHtml = r.guess ? `<span class="guess">[推测: ${r.guess}]</span>` : '';
    return `<tr>
      <td>${iconHtml}</td>
      <td class="zh">${r.zh}</td>
      <td class="en">${r.en}</td>
      <td><span class="type-badge ${r.icon ? '' : 'noicon'}">${r.type_cn}</span></td>
      <td>${r.image}</td>
      <td class="desc">${r.desc} ${guessHtml}</td>
      <td>${r.guess || ''}</td>
      <td>${srcHtml}</td>
    </tr>`;
  }).join('');
  document.getElementById('pageInfo').textContent = `第 ${currentPage+1}/${Math.max(1,Math.ceil(filtered.length/PAGE_SIZE))} 页 (共 ${filtered.length} 条)`;
  document.getElementById('stat').textContent = `显示 ${filtered.length}/${DATA.length} 条`;
  document.getElementById('prevBtn').disabled = currentPage === 0;
  document.getElementById('nextBtn').disabled = currentPage >= Math.ceil(filtered.length/PAGE_SIZE) - 1;
}

function applyFilter() {
  const q = document.getElementById('search').value.toLowerCase();
  const t = document.getElementById('typeFilter').value;
  const ic = document.getElementById('iconFilter').value;
  filtered = DATA.filter(r => {
    if (t && r.type_cn !== t) return false;
    if (ic === 'has' && !r.icon) return false;
    if (ic === 'none' && r.icon) return false;
    if (q) {
      const hay = (r.zh + ' ' + r.en + ' ' + r.desc + ' ' + (r.guess||'')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  currentPage = 0;
  render();
}

document.getElementById('search').addEventListener('input', applyFilter);
document.getElementById('typeFilter').addEventListener('change', applyFilter);
document.getElementById('iconFilter').addEventListener('change', applyFilter);
document.getElementById('prevBtn').addEventListener('click', () => { currentPage--; render(); });
document.getElementById('nextBtn').addEventListener('click', () => { currentPage++; render(); });

render();
</script>
